name: Build docker image

on:
  push:
    branches:
    - main

    tags:
    - '*'

env:
  BASE_IMAGE_STABILITY_TAG: 2.16.0

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check scanned-image publication
      run: python3 tests/scanned-image-release.py
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      with:
        version: '5.9'
        tags: 5.9,5,latest
