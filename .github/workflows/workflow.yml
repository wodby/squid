name: Build docker image

on:
  pull_request:
  push:
    branches:
    - main

    tags:
    - '*'
    - '!*-r[0-9]*'

env:
  BASE_IMAGE_REVISION: r1
  SQUID7: '7.6'

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check scanned-image publication
      run: python3 tests/scanned-image-release.py
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      with:
        version: ${{ env.SQUID7 }}
        tags: ${{ env.SQUID7 }},7,latest

  image-revision-aliases:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/r')
    needs: [ latest ]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: image-revision-aliases-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: wodby/images/.github/actions/image-revision-aliases@412e2d9ce29c41835ff653b0945bba72eabd9efb
        with:
          docker_username: ${{ secrets.DOCKER_USERNAME }}
          docker_password: ${{ secrets.DOCKER_PASSWORD }}
