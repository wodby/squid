name: Build docker image

on:
  pull_request:
  push:
    branches:
    - main

    tags:
    - '*'

env:
  BASE_IMAGE_REVISION: 2.20.8
  SQUID7: '7.6'

jobs:
  latest:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - name: Check scanned-image publication
      run: python3 tests/scanned-image-release.py
    - uses: ./.github/actions
      env:
        DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
        DOCKER_PASSWORD: ${{ secrets.DOCKER_PASSWORD }}
      with:
        version: ${{ env.SQUID7 }}
        tags: ${{ env.SQUID7 }},7,latest
